<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemplar preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, scholarly reference; same house style as the Explorer prototype.
   IDEA: the entry page a student lands on, shown for review before it goes live.
   PICTURE: each entry's own visual (interactive truth table, argument map).
   COLOUR and TYPE: white ground; Reason cobalt, Philosophy coral; Fraunces headings, Source Sans 3 body.
   LAYOUT: review banner, entry links, then each entry in a 760px reading column. */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#10131b);--ink:light-dark(#151826,#eef0f6);--mute:light-dark(#5b6072,#a5abbd);
 --line:light-dark(#e3e5ee,#2a2f3d);--panel:light-dark(#f5f6fa,#181c27);
 --r:light-dark(#2340c8,#7d93ff);--r-soft:light-dark(#e8ecfd,#1c2445);
 --p:light-dark(#d4432b,#ff8a72);--p-soft:light-dark(#fdebe7,#3a1f1b);
 --ok:light-dark(#1d6b3a,#7fd39c);--bad:light-dark(#b42318,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:750;line-height:1.1;text-wrap:balance}
header{padding:22px max(5vw,16px) 16px;border-bottom:1px solid var(--line)}
header h1{font-size:24px;margin:0}
header p{margin:6px 0 0;color:var(--mute);font-size:15px;max-width:70ch}
nav.scroll{display:flex;gap:8px;padding:12px max(5vw,16px);border-bottom:1px solid var(--line);overflow-x:auto}
nav.scroll a{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;min-height:40px}
nav.scroll a:hover{border-color:var(--r)}
@media(min-width:900px){nav.scroll{position:sticky;top:0;background:var(--bg);z-index:3}}
html{scroll-padding-top:72px}
main{padding:0 max(5vw,16px) 64px}
.entry{max-width:760px;margin:0 auto;padding:40px 0;border-bottom:1px solid var(--line)}
.entry h2{font-size:clamp(34px,5vw,48px);color:var(--c);margin:8px 0 14px}
.entry>p:first-of-type{font-size:19px}
.entry h3{font-size:24px;margin:34px 0 10px}
.entry h4{font-size:19px;margin:24px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--c);white-space:nowrap}
.tag.st{background:var(--panel);color:var(--mute)}
a{color:var(--c);text-underline-offset:3px}
.xref{border-bottom:1px dashed var(--mute);cursor:help}
code{font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;background:var(--panel);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
blockquote{margin:16px 0;padding:12px 18px;border-left:4px solid var(--c);background:var(--soft);border-radius:0 12px 12px 0}
blockquote p{margin:4px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:12px 0 16px;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--ink)}
.sf{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0 16px}
.sf div{display:grid;grid-template-columns:3em 1fr;gap:4px;padding:2px 0}
.sf .c{border-top:1px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:600}
.map{background:var(--panel);border-radius:14px;padding:16px;margin:12px 0;overflow-x:auto}
.map pre{margin:0;background:none;font-family:inherit}
/* truth table widget */
.coinsim{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:var(--panel)}
.coinsim .simtitle{font-weight:700;margin:0 0 8px}
.coinsim .simbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.coinsim button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer}
.coinsim .simout p{margin:4px 0;font-variant-numeric:tabular-nums}
.coinsim .key{font-size:14px;color:var(--mute);margin:6px 0 0}
.tt{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:var(--panel)}
.tt .forms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tt button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer}
.tt button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.tt table{background:var(--bg);margin:0}
.tt td,.tt th{text-align:center;font-variant-numeric:tabular-nums}
.tt tr.live td{background:var(--soft);font-weight:700}
.tt tr.chk td{box-shadow:inset 0 2px 0 var(--line),inset 0 -2px 0 var(--line)}
.tt tr.ce td{background:color-mix(in srgb,var(--bad) 16%,transparent);font-weight:700}
.tt .verdict{margin:10px 0 0;font-weight:700}
.tt .verdict.ok{color:var(--ok)}.tt .verdict.no{color:var(--bad)}
.tt .key{font-size:14px;color:var(--mute);margin:6px 0 0}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
@media(max-width:600px){table{font-size:14px}}
.map{position:relative}
.map-expand{position:absolute;top:8px;right:8px;z-index:1;font:inherit;font-size:.85rem;padding:4px 10px;border-radius:8px;border:1px solid currentColor;background:var(--panel);color:inherit;cursor:pointer;opacity:.85}
.map-expand:hover,.map-expand:focus-visible{opacity:1}
.map-full{position:fixed;inset:0;z-index:1000;background:var(--bg,#fff);display:flex;flex-direction:column}
.map-full .bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;border-bottom:1px solid rgba(127,127,127,.3)}
.map-full .bar span{margin-right:auto;font-weight:600}
.map-full .bar button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid currentColor;background:none;color:inherit;cursor:pointer}
.map-full .canvas{flex:1;overflow:auto;padding:16px;touch-action:pan-x pan-y pinch-zoom}
.map-full .canvas svg{display:block;margin:0 auto;max-width:none!important;height:auto}
/* argument maps take the entry's branch colour (Reason cobalt, Philosophy coral; John, 26 Nov 2026) */
:is(.map,.map-full) svg .node :is(rect,polygon,circle,ellipse,path){fill:var(--soft)!important;stroke:var(--c)!important}
{{TABS_CSS}}</style>
</head>
<body>
<header>
<h1>Philosophy &amp; Reason Explorer: exemplar preview</h1>
<p>Phase 0 exemplars for review. Status: checked by two independent passes; not yet approved. Dashed links point to entries that are not written yet.</p>
</header>
<nav class="scroll" aria-label="Entries">{{NAV}}</nav>
<main>
{{ENTRIES}}
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
{
{{TT_WIDGET}}
document.querySelectorAll('.tt').forEach(truthTable);
document.querySelectorAll('.coinsim').forEach(coinSim);
try{
 const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
 mermaid.initialize({startOnLoad:false,theme:dark?'dark':'base',themeVariables:{fontFamily:'Source Sans 3, sans-serif',primaryColor:'#fdebe7',primaryBorderColor:'#d4432b',lineColor:'#5b6072'}});
 window.prRunMermaid=nodes=>mermaid.run({nodes:[...nodes]});
 prRunMermaid([...document.querySelectorAll('pre.mermaid')].filter(m=>!m.closest('[hidden]')));
}catch(e){}
}
</script>
<script>
{{TABS_JS}}
// ---------- argument map: full-screen view ----------
document.addEventListener('click',e=>{
 const b=e.target.closest('.map-expand');if(!b)return;
 const svg=b.parentElement.querySelector('svg');if(!svg)return;
 const vb=(svg.getAttribute('viewBox')||'').split(/\s+/).map(Number),natW=vb[2]||svg.getBoundingClientRect().width;
 const o=document.createElement('div');o.className='map-full';{const art=b.closest('.entry');if(art)o.style.cssText=art.style.cssText}o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Argument map, full screen');
 o.innerHTML='<div class="bar"><span>Argument map</span><button data-z="-1" aria-label="Zoom out">−</button><button data-z="1" aria-label="Zoom in">+</button><button data-z="0">Fit</button><button class="close">Close</button></div><div class="canvas"></div>';
 const c=o.querySelector('.canvas'),s=svg.cloneNode(true);s.removeAttribute('style');c.appendChild(s);
 const fit=()=>Math.max(natW,Math.min(window.innerWidth-40,natW*2.2));let w=fit();
 const set=()=>{s.setAttribute('width',Math.round(w));s.removeAttribute('height')};set();
 const close=()=>{o.remove();document.removeEventListener('keydown',key);b.focus()};
 const key=ev=>{if(ev.key==='Escape')close()};
 o.addEventListener('click',ev=>{const z=ev.target.closest('[data-z]');if(z){const d=+z.dataset.z;w=d?w*(d>0?1.25:0.8):fit();set()}else if(ev.target.closest('.close'))close()});
 document.addEventListener('keydown',key);document.body.appendChild(o);o.querySelector('.close').focus();
});
</script>
</body>
</html>
